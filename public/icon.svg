<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- checklist lines -->
  <!-- row 1: checked -->
  <circle cx="152" cy="180" r="28" fill="none" stroke="white" stroke-width="16" opacity="0.9"/>
  <polyline points="139,180 150,192 168,168" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <rect x="204" y="166" width="160" height="16" rx="8" fill="white" opacity="0.9"/>
  <rect x="204" y="192" width="100" height="12" rx="6" fill="white" opacity="0.45"/>

  <!-- row 2: unchecked -->
  <circle cx="152" cy="280" r="28" fill="none" stroke="white" stroke-width="16" opacity="0.6"/>
  <rect x="204" y="266" width="140" height="16" rx="8" fill="white" opacity="0.6"/>
  <rect x="204" y="292" width="80" height="12" rx="6" fill="white" opacity="0.3"/>

  <!-- row 3: checked -->
  <circle cx="152" cy="380" r="28" fill="none" stroke="white" stroke-width="16" opacity="0.9"/>
  <polyline points="139,380 150,392 168,368" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <rect x="204" y="366" width="120" height="16" rx="8" fill="white" opacity="0.9"/>
  <rect x="204" y="392" width="60" height="12" rx="6" fill="white" opacity="0.45"/>
</svg>
